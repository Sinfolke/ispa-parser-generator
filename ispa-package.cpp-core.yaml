# `--stdlib core`: the core runtime lowered to C++ plus its facade (C++17), and the ispastdlib headers the
# facade still includes. Self-contained: besides `target-core` (its own ispa_std sources), it needs nothing
# from `cpp-target`.
name: cpp-core
requires:
  - target-core
layout:
  root: parser/stdlibs
  ispalib: {}
  ispatarget:
    cpp-core: target/cpp-core
