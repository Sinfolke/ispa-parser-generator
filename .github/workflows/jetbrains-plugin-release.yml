name: JetBrains plugin release

on:
  push:
    branches: [main]
    paths: [plugins/jebtrains/build.gradle.kts]
  workflow_dispatch:
    inputs:
      publish_marketplace:
        description: Upload to JetBrains Marketplace when PUBLISH_TOKEN is configured
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.check.outputs.changed }}
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Check plugin version
        id: check
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
        run: |
          python3 - <<'PY'
          import os
          import re
          import subprocess
          from pathlib import Path

          path = 'plugins/jebtrains/build.gradle.kts'
          pattern = re.compile(r'^version\s*=\s*"([0-9]+\.[0-9]+\.[0-9]+(?:[-.][A-Za-z0-9]+)*)"', re.M)
          def version(text):
              match = pattern.search(text)
              if not match:
                  raise SystemExit('Cannot find plugin version')
              return match.group(1)
          current = version(Path(path).read_text())
          previous = None
          if os.environ['EVENT_NAME'] == 'push':
              try:
                  previous = version(subprocess.check_output(
                      ['git', 'show', os.environ['BEFORE'] + ':' + path], text=True))
              except subprocess.CalledProcessError:
                  pass
          changed = os.environ['EVENT_NAME'] == 'workflow_dispatch' or previous != current
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f'version={current}\nchanged={str(changed).lower()}\n')
          print(f'Plugin version: {current}; previous: {previous}; release: {changed}')
          PY

  native:
    needs: version
    if: needs.version.outputs.changed == 'true'
    name: Bridge ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-26.04, platform: linux-x64, binary: ispa-grammar-bridge }
          - { os: windows-latest, platform: windows-x64, binary: ispa-grammar-bridge.exe }
          - { os: macos-26, platform: macos-arm64, binary: ispa-grammar-bridge }
          - { os: macos-26-intel, platform: macos-x64, binary: ispa-grammar-bridge }
    steps:
      - uses: actions/checkout@v4
      - name: Build native parser bridge
        shell: bash
        run: |
          cmake -S plugins/jebtrains -B bridge-build -DCMAKE_BUILD_TYPE=Release
          cmake --build bridge-build --config Release --parallel 2
      - name: Stage native parser bridge
        shell: bash
        env:
          PLATFORM: ${{ matrix.platform }}
          BINARY: ${{ matrix.binary }}
        run: |
          mkdir -p "release-bridges/$PLATFORM"
          if [[ "$RUNNER_OS" == Windows ]]; then
            cp "bridge-build/Release/$BINARY" "release-bridges/$PLATFORM/$BINARY"
          else
            cp "bridge-build/$BINARY" "release-bridges/$PLATFORM/$BINARY"
          fi
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test native parser bridge
        shell: bash
        env:
          PLATFORM: ${{ matrix.platform }}
          BINARY: ${{ matrix.binary }}
        run: python plugins/jebtrains/tests/bridge_test.py "release-bridges/$PLATFORM/$BINARY"
      - uses: actions/upload-artifact@v4
        with:
          name: bridge-${{ matrix.platform }}
          path: release-bridges/${{ matrix.platform }}/
          if-no-files-found: error

  release:
    needs: [version, native]
    runs-on: ubuntu-26.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/download-artifact@v4
        with:
          pattern: bridge-*
          path: plugins/jebtrains/release-bridges
          merge-multiple: false
      - name: Arrange and verify native binaries
        shell: bash
        run: |
          set -euo pipefail
          for platform in linux-x64 windows-x64 macos-arm64 macos-x64; do
            name=ispa-grammar-bridge
            if [[ "$platform" == windows-* ]]; then name="$name.exe"; fi
            mv "plugins/jebtrains/release-bridges/bridge-$platform" "plugins/jebtrains/release-bridges/$platform"
            test -s "plugins/jebtrains/release-bridges/$platform/$name"
          done
      - name: Test and package universal plugin
        working-directory: plugins/jebtrains
        run: bash ./gradlew test buildPlugin -PispaReleaseBridges=release-bridges --no-daemon
      - name: Verify packaged platforms
        working-directory: plugins/jebtrains
        shell: bash
        run: |
          set -euo pipefail
          jar="build/libs/ispa-grammar-${{ needs.version.outputs.version }}.jar"
          for platform in linux-x64 windows-x64 macos-arm64 macos-x64; do
            name=ispa-grammar-bridge
            if [[ "$platform" == windows-* ]]; then name="$name.exe"; fi
            unzip -Z1 "$jar" | grep -Fx "native/$platform/$name"
          done
      - name: Publish GitHub Release asset
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          tag="jetbrains-v$VERSION"
          asset="plugins/jebtrains/build/distributions/ispa-grammar-$VERSION.zip"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "$asset" --clobber
          else
            gh release create "$tag" "$asset" --target "$GITHUB_SHA" \
              --title "ISPA Grammar $VERSION" --generate-notes
          fi
      - name: Publish JetBrains Marketplace update
        if: github.event_name == 'push' || inputs.publish_marketplace
        working-directory: plugins/jebtrains
        env:
          PUBLISH_TOKEN: ${{ secrets.JETBRAINS_MARKETPLACE_TOKEN }}
        shell: bash
        run: |
          if [[ -z "$PUBLISH_TOKEN" ]]; then
            echo 'JETBRAINS_MARKETPLACE_TOKEN is unset; skipping Marketplace upload.'
            exit 0
          fi
          bash ./gradlew publishPlugin -PispaReleaseBridges=release-bridges --no-daemon
