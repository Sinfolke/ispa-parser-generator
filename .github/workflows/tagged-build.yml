name: Tagged build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  resolve-tag:
    name: Resolve release tag
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - name: Checkout repository and tags
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Select tag
        id: tag
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "release" ]]; then
            tag="$RELEASE_TAG"
          elif [[ "$REF_TYPE" == "tag" ]]; then
            tag="$REF_NAME"
          else
            # Manual run: select the highest version-numbered v* tag.
            tag="$(git tag --list 'v*' --sort=-version:refname | sed -n '1p')"
          fi
          if [[ -z "$tag" ]]; then
            echo 'No v* release tag found' >&2
            exit 1
          fi
          git rev-parse --verify "refs/tags/${tag}^{commit}" >/dev/null
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "Building release tag: $tag"

  prepare-release:
    name: Create draft GitHub Release
    needs: resolve-tag
    runs-on: ubuntu-latest
    steps:
      - name: Create draft if missing
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.resolve-tag.outputs.tag }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release already exists for $TAG; keeping its publication state"
          else
            gh release create "$TAG" --verify-tag --generate-notes --title "$TAG" --draft
          fi

  build:
    name: Reuse multi-platform CMake build
    needs: [resolve-tag, prepare-release, pkg]
    permissions:
      contents: write
      actions: write
    uses: ./.github/workflows/cmake-multi-platform.yml
    with:
      checkout_ref: ${{ needs.resolve-tag.outputs.tag }}
      upload_artifacts: true
      release_tag: ${{ needs.resolve-tag.outputs.tag }}

  pkg:
    name: Compile Python CLIs for release
    needs: [resolve-tag, prepare-release]
    permissions:
      contents: write
    uses: ./.github/workflows/ispa-pkg-release.yml
    with:
      checkout_ref: ${{ needs.resolve-tag.outputs.tag }}
      release_tag: ${{ needs.resolve-tag.outputs.tag }}

  jetbrains:
    name: Package JetBrains plugin for release
    needs: [resolve-tag, prepare-release]
    permissions:
      contents: write
    uses: ./.github/workflows/jetbrains-plugin-release.yml
    with:
      release_tag: ${{ needs.resolve-tag.outputs.tag }}

