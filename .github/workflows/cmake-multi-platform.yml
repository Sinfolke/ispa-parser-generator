
name: CMake on multiple platforms

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:
    inputs:
      platform:
        description: Platform to build
        type: choice
        default: all
        options:
          - all
          - linux-x64
          - windows-x64
          - macos-arm64
          - macos-x64
  workflow_call:
    inputs:
      platform:
        description: Platform to build (all or one platform)
        type: string
        required: false
        default: all
      checkout_ref:
        description: Git ref to build; empty uses triggering commit
        type: string
        required: false
        default: ''
      upload_artifacts:
        description: Also save uncompressed platform artifacts in GitHub Actions
        type: boolean
        required: false
        default: false
      release_tag:
        description: GitHub Release tag to publish completed platform archives to
        type: string
        required: false
        default: ''
    secrets:
      ISPA_CODESIGN_CERT_BASE64:
        required: false
      ISPA_CODESIGN_CERT_PASSWORD:
        required: false

permissions:
  contents: read
  actions: write

env:
  CMAKE_VERSION: '4.5.0-rc1'
jobs:
  pkg:
    name: Test Python package manager
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.checkout_ref || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install CLI dependencies
        run: python -m pip install -e .
      - name: Test package manager
        run: python -m unittest tests/test_ispa_pkg.py -v


  plan:
    name: Select requested CMake platforms
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.select.outputs.matrix }}
    steps:
      - id: select
        shell: bash
        env:
          SELECTED_PLATFORM: ${{ inputs.platform || 'all' }}
        run: |
          python3 - <<'PY'
          import json, os
          platforms = [{"os":"ubuntu-26.04","artifact_name":"ispa-linux-x64","c_compiler":"clang-20","cpp_compiler":"clang++-20","triplet":"x64-linux-libcxx","overlay_triplets":"cmake/triplets","extra_cxx_flags":"-stdlib=libc++"},{"os":"windows-latest","artifact_name":"ispa-windows-x64","c_compiler":"clang-cl","cpp_compiler":"clang-cl","triplet":"x64-windows-static-md","overlay_triplets":"cmake/triplets","extra_cxx_flags":""},{"os":"macos-26","artifact_name":"ispa-macos-arm64","c_compiler":"clang","cpp_compiler":"clang++","triplet":"arm64-osx","overlay_triplets":"","extra_cxx_flags":""},{"os":"macos-26-intel","artifact_name":"ispa-macos-x64","c_compiler":"clang","cpp_compiler":"clang++","triplet":"x64-osx","overlay_triplets":"","extra_cxx_flags":""}]
          selected = os.environ["SELECTED_PLATFORM"]
          items = [p for p in platforms if selected == "all" or p["artifact_name"] == "ispa-" + selected]
          if not items: raise SystemExit("Unknown platform: " + selected)
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              print("matrix=" + json.dumps({"include": items}, separators=(",", ":")), file=output)
          PY

  build:
    needs: [pkg, plan]
    permissions:
      contents: write
      actions: write
    name: ${{ matrix.os }} / ${{ matrix.cpp_compiler }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}

    steps:
      # -------------------------------------------------------
      # 1. Checkout
      # -------------------------------------------------------

      - name: Checkout code with submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1
          ref: ${{ inputs.checkout_ref || github.sha }}

      # -------------------------------------------------------
      # 2. Install CMake 4.5
      # -------------------------------------------------------

      - name: Install CMake (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $version = $env:CMAKE_VERSION
          $archive = "cmake-$version-windows-x86_64.zip"
          $url = "https://github.com/Kitware/CMake/releases/download/v$version/$archive"

          Invoke-WebRequest -Uri $url -OutFile $archive

          $destination = "$env:RUNNER_TEMP/cmake"
          Expand-Archive -Path $archive -DestinationPath $destination

          $cmakeBin = "$destination/cmake-$version-windows-x86_64/bin"

          Add-Content -Path $env:GITHUB_PATH -Value $cmakeBin

          & "$cmakeBin/cmake.exe" --version

      - name: Install CMake (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail

          version="$CMAKE_VERSION"
          archive="cmake-${version}-linux-x86_64.sh"
          url="https://github.com/Kitware/CMake/releases/download/v${version}/${archive}"

          curl -fL "$url" -o cmake-install.sh

          mkdir -p "$RUNNER_TEMP/cmake"

          sh cmake-install.sh \
            --skip-license \
            --prefix="$RUNNER_TEMP/cmake" \
            --exclude-subdir

          echo "$RUNNER_TEMP/cmake/bin" >> "$GITHUB_PATH"

      - name: Install CMake (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail

          version="$CMAKE_VERSION"
          archive="cmake-${version}-macos-universal.tar.gz"
          url="https://github.com/Kitware/CMake/releases/download/v${version}/${archive}"

          curl -fL "$url" -o "$archive"

          mkdir -p "$RUNNER_TEMP/cmake"
          tar -xzf "$archive" -C "$RUNNER_TEMP/cmake"

          cmake_bin="$(
            find "$RUNNER_TEMP/cmake" \
              -type f -name cmake -print -quit
          )"

          if [[ -z "$cmake_bin" ]]; then
            echo "CMake executable not found"
            exit 1
          fi

          chmod +x "$cmake_bin"
          echo "$(dirname "$cmake_bin")" >> "$GITHUB_PATH"

      - name: Verify CMake
        shell: bash
        run: |
          cmake --version
          command -v cmake
      # -------------------------------------------------------
      # 3. Configure compilers and platform dependencies
      # -------------------------------------------------------

      - name: Setup MSVC environment
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Setup Windows LLVM
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $candidates = @(
            "C:\Program Files\LLVM\bin",
            "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Tools\Llvm\x64\bin"
          )

          $selected = $null

          foreach ($candidate in $candidates) {
            if (
              (Test-Path "$candidate\clang-cl.exe") -and
              (Test-Path "$candidate\clang-scan-deps.exe")
            ) {
              $selected = $candidate
              break
            }
          }

          if (-not $selected) {
            throw "Could not find clang-cl and clang-scan-deps together"
          }

          Add-Content -Path $env:GITHUB_PATH -Value $selected

          Write-Host "LLVM: $selected"
          & "$selected\clang-cl.exe" --version
          & "$selected\clang-scan-deps.exe" --version

      - name: Install dependencies (Ubuntu)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail

          sudo apt-get update

          sudo apt-get install -y \
            clang-20 \
            clang-tools-20 \
            gcc-15 \
            ninja-build \
            libboost-all-dev \
            libc++-20-dev \
            libc++abi-20-dev \
            valgrind \
            autoconf \
            autoconf-archive \
            automake \
            libtool \
            pkg-config \
            gettext \
            make

      - name: Add LLVM tools to PATH (Ubuntu)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          echo "/usr/lib/llvm-20/bin" >> "$GITHUB_PATH"

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail          
          brew install \
            ninja \
            autoconf \
            autoconf-archive \
            automake \
            libtool \
            pkg-config \
            gettext
          
          # Make Autoconf Archive macros available to vcpkg/ICU.
          AUTOCONF_ARCHIVE_PREFIX="$(brew --prefix autoconf-archive)"
          ACLOCAL_DIR="$AUTOCONF_ARCHIVE_PREFIX/share/aclocal"
          
          echo "ACLOCAL_PATH=$ACLOCAL_DIR" >> "$GITHUB_ENV"
          
          # Ensure Homebrew tools are discoverable.
          echo "$(brew --prefix autoconf)/bin" >> "$GITHUB_PATH"
          echo "$(brew --prefix automake)/bin" >> "$GITHUB_PATH"
          echo "$(brew --prefix libtool)/bin" >> "$GITHUB_PATH"
          
          # Verify ICU build dependencies.
          test -d "$ACLOCAL_DIR"
          command -v autoconf
          command -v automake
          command -v aclocal
          
          echo "Autoconf Archive: $ACLOCAL_DIR"
      - name: Verify Ninja
        shell: bash
        run: |
          set -euo pipefail
          NINJA_PATH="$(command -v ninja)"
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            # CMake is a native Windows executable; MSYS /c/... paths are not native paths.
            NINJA_PATH="$(cygpath -m "$NINJA_PATH")"
          fi
          echo "NINJA_PATH=$NINJA_PATH" >> "$GITHUB_ENV"
          ninja --version
      - name: Setup Conda & Install LLVM 23 (macOS)
        if: runner.os == 'macOS'
        uses: conda-incubator/setup-miniconda@v3
        with:
          auto-update-conda: true
          channels: conda-forge
          channel-priority: strict

      - name: Install LLVM 23 via Conda (macOS)
        if: runner.os == 'macOS'
        shell: bash -l {0}
        run: |
          set -euo pipefail
          
          conda install -y -c conda-forge \
            llvmdev=23 clangdev=23 clang=23 clangxx=23 clang-scan-deps=23
          # Use CONDA_PREFIX (points to the currently active environment)
          LLVM_PREFIX="$CONDA_PREFIX"
          
          LLVM_VERSION="$("$LLVM_PREFIX/bin/llvm-config" --version)"
          echo "Installed LLVM via Conda: $LLVM_VERSION"
          
          # Export compiler paths for CMake and vcpkg.
          echo "$LLVM_PREFIX/bin" >> "$GITHUB_PATH"
          echo "LLVM_PREFIX=$LLVM_PREFIX" >> "$GITHUB_ENV"
          echo "CC=$LLVM_PREFIX/bin/clang" >> "$GITHUB_ENV"
          echo "CXX=$LLVM_PREFIX/bin/clang++" >> "$GITHUB_ENV"
          
          # Verify compiler and module scanner.
          "$LLVM_PREFIX/bin/clang" --version
          "$LLVM_PREFIX/bin/clang++" --version
          "$LLVM_PREFIX/bin/clang-scan-deps" --version
          "$LLVM_PREFIX/bin/llvm-config" --version

      - name: Install libc++ module resources (macOS)
        if: runner.os == 'macOS'
        shell: bash -l {0}
        run: |
          set -euo pipefail
          
          LLVM_PREFIX="${LLVM_PREFIX:?LLVM_PREFIX must be configured}"
          LLVM_VERSION="$("$LLVM_PREFIX/bin/llvm-config" --version)"
          
          echo "LLVM version: $LLVM_VERSION"
          
          SOURCE_DIR="$RUNNER_TEMP/llvm-project"
          BUILD_DIR="$RUNNER_TEMP/libcxx-build"
          MODULE_PREFIX="$RUNNER_TEMP/libcxx-modules"
          
          git clone --depth 1 \
            --branch "llvmorg-$LLVM_VERSION" \
            https://github.com/llvm/llvm-project.git \
            "$SOURCE_DIR"
          
          cmake -S "$SOURCE_DIR/libcxx" \
            -B "$BUILD_DIR" \
            -G Ninja \
            -DCMAKE_C_COMPILER="$LLVM_PREFIX/bin/clang" \
            -DCMAKE_CXX_COMPILER="$LLVM_PREFIX/bin/clang++" \
            -DCMAKE_INSTALL_PREFIX="$MODULE_PREFIX" \
            -DLIBCXX_CXX_ABI=none \
            -DLIBCXX_INSTALL_MODULES=ON \
            -DLIBCXX_INSTALL_HEADERS=OFF \
            -DLIBCXX_INSTALL_LIBRARY=OFF \
            -DLIBCXX_INCLUDE_TESTS=OFF \
            -DLIBCXX_INCLUDE_BENCHMARKS=OFF
          
          cmake --build "$BUILD_DIR" \
            --target install-cxx-modules \
            --parallel 3
          
          MODULES_JSON="$MODULE_PREFIX/lib/libc++.modules.json"
          
          if [[ ! -f "$MODULES_JSON" ]]; then
            echo "::error::libc++.modules.json not found"
            exit 1
          fi
          
          if [[ ! -f "$MODULE_PREFIX/share/libc++/v1/std.cppm" ]]; then
            echo "::error::std.cppm not found"
            exit 1
          fi
          
          if [[ ! -f "$MODULE_PREFIX/share/libc++/v1/std.compat.cppm" ]]; then
            echo "::error::std.compat.cppm not found"
            exit 1
          fi
          
          echo "LIBCXX_MODULES_JSON=$MODULES_JSON" >> "$GITHUB_ENV"
          
          echo "Successfully installed libc++ module resources:"
          ls -lh "$MODULES_JSON"
          ls -lh "$MODULE_PREFIX/share/libc++/v1/"
      # -------------------------------------------------------
      # 4. Fix libc++ module path for Ubuntu Clang
      # -------------------------------------------------------

      - name: Fix libc++ modules std path (Ubuntu)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail

          real=/usr/lib/llvm-20/share/libc++/v1
          bogus=/lib/share/libc++/v1

          if [[ -d "$real" && ! -e "$bogus" ]]; then
            sudo mkdir -p "$(dirname "$bogus")"
            sudo ln -sfn "$real" "$bogus"
          fi

          ls -la "$bogus" 2>&1 || true
      - name: Configure libc++ modules path (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          
          MODULE_PREFIX="$RUNNER_TEMP/libcxx-modules"
          MODULES_JSON="$MODULE_PREFIX/lib/libc++.modules.json"
          
          test -f "$MODULES_JSON"
          test -f "$MODULE_PREFIX/share/libc++/v1/std.cppm"
          test -f "$MODULE_PREFIX/share/libc++/v1/std.compat.cppm"
          
          echo "LIBCXX_MODULES_JSON=$MODULES_JSON" >> "$GITHUB_ENV"
          
          echo "Using libc++ module manifest: $MODULES_JSON"
      # -------------------------------------------------------
      # 5. Setup vcpkg
      # -------------------------------------------------------

      - name: Install vcpkg
        shell: bash
        run: |
          set -euo pipefail
          
          VCPKG_ROOT="$RUNNER_TEMP/vcpkg"
          BASELINE="0c102a84b69c2c923c28a97f756d5ecd9a90c48a"
          
          # Full repository history is needed for versioned dependencies.
          git clone https://github.com/microsoft/vcpkg.git "$VCPKG_ROOT"
          
          cd "$VCPKG_ROOT"
          
          # Verify historical baseline is available.
          git show "$BASELINE:versions/baseline.json" > /dev/null
          
          # Verify requested package version exists.
          python3 -c '
          import json
          with open("versions/t-/tsl-ordered-map.json") as f:
              versions = json.load(f)["versions"]
          assert any(v.get("version") == "1.2.0" for v in versions), \
              "tsl-ordered-map 1.2.0 is missing"
          '
          
          # Do NOT checkout the historical baseline.
          # Keep the newer vcpkg checkout.
          
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            ./bootstrap-vcpkg.bat -disableMetrics
          else
            ./bootstrap-vcpkg.sh -disableMetrics
          fi
          
          echo "VCPKG_ROOT=$VCPKG_ROOT" >> "$GITHUB_ENV"
          echo "VCPKG_INSTALLATION_ROOT=$VCPKG_ROOT" >> "$GITHUB_ENV"
          echo "$VCPKG_ROOT" >> "$GITHUB_PATH"
          
          git rev-parse HEAD

      - name: Resolve vcpkg installation
        shell: bash
        run: |
          set -euo pipefail

          root="${VCPKG_INSTALLATION_ROOT:-${VCPKG_ROOT:-}}"

          if [[ -z "$root" ]]; then
            echo "VCPKG_INSTALLATION_ROOT is not configured"
            exit 1
          fi

          if [[ ! -f "$root/scripts/buildsystems/vcpkg.cmake" ]]; then
            echo "Invalid vcpkg installation: $root"
            exit 1
          fi

          echo "VCPKG_INSTALLATION_ROOT=$root" >> "$GITHUB_ENV"

          echo "Using vcpkg at: $root"

      # -------------------------------------------------------
      # 6. Setup sccache
      # -------------------------------------------------------
      - name: Configure sccache directory
        shell: bash
        run: |
          echo "SCCACHE_DIR=$RUNNER_TEMP/sccache" >> "$GITHUB_ENV"
      - name: Setup sccache
        uses: mozilla-actions/sccache-action@v0.0.8

      - name: Restore sccache
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.SCCACHE_DIR }}
          key: sccache-${{ matrix.os }}-${{ matrix.triplet }}-${{ github.sha }}
          restore-keys: |
            sccache-${{ matrix.os }}-${{ matrix.triplet }}-

      - name: Export GitHub Actions Cache Token
        uses: actions/github-script@v7
        with:
          script: |
            core.exportVariable(
              'ACTIONS_CACHE_URL',
              process.env['ACTIONS_CACHE_URL'] || ''
            );
            core.exportVariable(
              'ACTIONS_RUNTIME_TOKEN',
              process.env['ACTIONS_RUNTIME_TOKEN'] || ''
            );

      - name: Set vcpkg binary caching
        shell: bash
        run: |
          echo "VCPKG_BINARY_SOURCES=clear;x-gha,readwrite" >> "$GITHUB_ENV"

      - name: Zero sccache statistics
        shell: bash
        run: |
          sccache --zero-stats || true

      # -------------------------------------------------------
      # 7. Verify toolchain
      # -------------------------------------------------------

      - name: Verify build tools
        shell: bash
        env:
          MATRIX_CC: ${{ matrix.c_compiler }}
          MATRIX_CXX: ${{ matrix.cpp_compiler }}
        run: |
          set -euo pipefail

          echo "Operating system: $RUNNER_OS"
          echo "Architecture: $RUNNER_ARCH"

          cmake --version
          ninja --version

          if [[ "$RUNNER_OS" == "macOS" ]]; then
            "$CC" --version
            "$CXX" --version
          else
            "$MATRIX_CC" --version
            "$MATRIX_CXX" --version
          fi

          clang-scan-deps --version

          echo "vcpkg: $VCPKG_INSTALLATION_ROOT"

      - name: Record build environment
        shell: bash
        env:
          MATRIX_OS: ${{ matrix.os }}
          MATRIX_TRIPLET: ${{ matrix.triplet }}
        run: |
          set +e
          mkdir -p diag
          {
            echo "## Build environment: $MATRIX_OS / $MATRIX_TRIPLET"
            echo '```'
            echo "runner: $RUNNER_OS $RUNNER_ARCH"
            uname -a
            echo "--- tools"
            command -v cmake ninja clang clang++ clang-cl clang-scan-deps sccache
            cmake --version | head -n 1
            ninja --version
            echo "CC=${CC:-} CXX=${CXX:-} LLVM_PREFIX=${LLVM_PREFIX:-}"
            if [[ -n "${CXX:-}" ]]; then "$CXX" --version | head -n 2; fi
            echo "--- vcpkg: ${VCPKG_INSTALLATION_ROOT:-unset}"
            git -C "${VCPKG_INSTALLATION_ROOT:-.}" rev-parse HEAD 2>/dev/null
            echo "--- PATH"
            echo "$PATH" | tr ':' '\n'
            echo "--- variables that influence compiler/linker/package search paths"
            env | sort \
              | grep -E '^(CONDA|CPATH|CPLUS_INCLUDE_PATH|C_INCLUDE_PATH|OBJC_INCLUDE_PATH|LIBRARY_PATH|LD_LIBRARY_PATH|DYLD_|CMAKE_|CPPFLAGS|CFLAGS|CXXFLAGS|LDFLAGS|SDKROOT|MACOSX_DEPLOYMENT_TARGET|ICU_|PKG_CONFIG|VCPKG_|ACLOCAL_PATH|CC=|CXX=)' \
              | grep -viE 'TOKEN|SECRET|PASSWORD'
            echo '```'
          } 2>&1 | tee -a "$GITHUB_STEP_SUMMARY" diag/environment.txt

          # Early warning: a second ICU (e.g. inside the conda LLVM prefix) next to vcpkg's ICU
          if [[ -n "${LLVM_PREFIX:-}" && -f "$LLVM_PREFIX/include/unicode/uvernum.h" ]]; then
            conda_icu="$(grep -E '^#define U_ICU_VERSION_MAJOR_NUM' "$LLVM_PREFIX/include/unicode/uvernum.h")"
            echo "::warning title=Second ICU found in LLVM prefix::$LLVM_PREFIX/include/unicode exists ($conda_icu) and may shadow vcpkg's ICU headers"
          fi
          exit 0

      # -------------------------------------------------------
      # 8. Configure CMake
      # -------------------------------------------------------

      - name: Configure CMake
        shell: bash
        env:
          PROGRAM_VERSION: ${{ inputs.release_tag || (github.ref_type == 'tag' && github.ref_name) || 'dev' }}
          MATRIX_CC: ${{ matrix.c_compiler }}
          MATRIX_CXX: ${{ matrix.cpp_compiler }}
          MATRIX_TRIPLET: ${{ matrix.triplet }}
          MATRIX_OVERLAY: ${{ matrix.overlay_triplets }}
          MATRIX_CXX_FLAGS: ${{ matrix.extra_cxx_flags }}
        run: |
          set -euo pipefail
          
          # -------------------------------------------------------
          # 1. Select compiler
          # -------------------------------------------------------
          
          if [[ "$RUNNER_OS" == "macOS" ]]; then
            COMPILER_C="$LLVM_PREFIX/bin/clang"
            COMPILER_CXX="$LLVM_PREFIX/bin/clang++"
          else
            COMPILER_C="$MATRIX_CC"
            COMPILER_CXX="$MATRIX_CXX"
          fi
          
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            # Resolve the real Windows executables.
            COMPILER_C="$(command -v clang-cl.exe)"
            COMPILER_CXX="$COMPILER_C"
            
            # Convert Git Bash paths to native Windows paths.
            COMPILER_C="$(cygpath -m "$COMPILER_C")"
            COMPILER_CXX="$(cygpath -m "$COMPILER_CXX")"
          else
            COMPILER_C="$(command -v "$COMPILER_C")"
            COMPILER_CXX="$(command -v "$COMPILER_CXX")"
          fi
          
          # Validate before running CMake.
          if [[ ! -f "$COMPILER_C" || ! -f "$COMPILER_CXX" ]]; then
          echo "Compiler paths:"
          echo "C:   $COMPILER_C"
          echo "C++: $COMPILER_CXX"
          
          echo "Compiler executable not found"
          exit 1
          fi
          
          export CC="$COMPILER_C"
          export CXX="$COMPILER_CXX"
        
          echo "Selected C compiler:   $CC"
          echo "Selected C++ compiler: $CXX"
          
          "$CC" --version
          "$CXX" --version
          
          # -------------------------------------------------------
          # 2. Configure CMake
          # -------------------------------------------------------
          
          CMAKE_ARGS=(
            -S "$GITHUB_WORKSPACE"
            -B build
            -G Ninja
            "-DPROGRAM_VERSION=$PROGRAM_VERSION"
            
            "-DCMAKE_C_COMPILER=$CC"
            "-DCMAKE_CXX_COMPILER=$CXX"
            
            "-DCMAKE_TOOLCHAIN_FILE=$VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake"
            "-DVCPKG_TARGET_TRIPLET=$MATRIX_TRIPLET"
            
            "-DCMAKE_C_COMPILER_LAUNCHER=sccache"
            "-DCMAKE_CXX_COMPILER_LAUNCHER=sccache"
            
            "-DCMAKE_CXX_SCAN_FOR_MODULES=ON"
            "-DCMAKE_BUILD_TYPE=Release"
            "-DCMAKE_MAKE_PROGRAM=$NINJA_PATH"
            "-DCMAKE_EXPORT_COMPILE_COMMANDS=ON"
          )
          
          # Windows: embedded debug information for sccache.
          if [[ "$RUNNER_OS" == "Windows" ]]; then
          CMAKE_ARGS+=(
            "-DCMAKE_MSVC_DEBUG_INFORMATION_FORMAT=Embedded"
          )
          fi
          
          # Platform-specific C++ and linker flags.
          if [[ -n "$MATRIX_CXX_FLAGS" ]]; then
          CMAKE_ARGS+=(
            "-DCMAKE_CXX_FLAGS=$MATRIX_CXX_FLAGS"
            "-DCMAKE_EXE_LINKER_FLAGS=$MATRIX_CXX_FLAGS"
            "-DCMAKE_SHARED_LINKER_FLAGS=$MATRIX_CXX_FLAGS"
            "-DCMAKE_MODULE_LINKER_FLAGS=$MATRIX_CXX_FLAGS"
          )
          fi
          
          # Custom vcpkg triplets.
          if [[ -n "$MATRIX_OVERLAY" ]]; then
          CMAKE_ARGS+=(
            "-DVCPKG_OVERLAY_TRIPLETS=$GITHUB_WORKSPACE/$MATRIX_OVERLAY"
          )
          fi
          
          # Linux: share the version-independent libc++ toolchain
          # between the main project and vcpkg.
          if [[ "$RUNNER_OS" == "Linux" ]]; then
          CMAKE_ARGS+=(
            "-DVCPKG_CHAINLOAD_TOOLCHAIN_FILE=$GITHUB_WORKSPACE/cmake/toolchains/clang-libcxx.cmake"
          )
          fi
          if [[ "$RUNNER_OS" == "macOS" ]]; then
            CMAKE_ARGS+=(
            "-DCMAKE_CXX_STDLIB_MODULES_JSON=$LIBCXX_MODULES_JSON"
            "-DCMAKE_CXX_MODULE_STD=ON"
            "-DCMAKE_CXX_FLAGS=-fno-modules-reduced-bmi"
            )
          fi
          if [[ "$RUNNER_OS" == "macOS" ]]; then
            CMAKE_ARGS+=(
            "-DICU_ROOT=$GITHUB_WORKSPACE/build/vcpkg_installed/$MATRIX_TRIPLET"
            )
          fi
          # -------------------------------------------------------
          # 3. Run configuration
          # -------------------------------------------------------
          
          mkdir -p diag
          cmake --log-level=VERBOSE "${CMAKE_ARGS[@]}" 2>&1 | tee diag/configure.log

          if [[ "$RUNNER_OS" == "macOS" ]]; then
            echo "Resolved ICU configuration:"
            grep -E '^ICU_(ROOT|INCLUDE_DIR|UC_LIBRARY|DATA_LIBRARY)(:|_)' build/CMakeCache.txt || true
            grep -E '^ICU_VERSION:' build/CMakeCache.txt || true
          fi


      # -------------------------------------------------------
      # 9. Build
      # -------------------------------------------------------

      - name: Build
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p diag

          # Ninja always prints the full command of a FAILED step.
          # Re-run the job with "Enable debug logging" to print every command.
          verbose=()
          if [[ "${RUNNER_DEBUG:-}" == "1" ]]; then
            verbose=(--verbose)
          fi

          cmake --build build \
            --config Release \
            --parallel 3 \
            "${verbose[@]}" 2>&1 | tee diag/build.log

      - name: Diagnose build failure
        if: failure()
        shell: bash
        env:
          MATRIX_OS: ${{ matrix.os }}
          MATRIX_TRIPLET: ${{ matrix.triplet }}
          MATRIX_ARTIFACT: ${{ matrix.artifact_name }}
        run: |
          set +e
          mkdir -p diag/vcpkg-logs
          CACHE=build/CMakeCache.txt
          SUMMARY="${GITHUB_STEP_SUMMARY:-/dev/null}"

          # Log to analyse: build log if the build started, otherwise the configure log.
          LOG=diag/build.log
          if [[ ! -s "$LOG" ]]; then LOG=diag/configure.log; fi
          [[ -f "$LOG" ]] || : > "$LOG"
          tr -d '\r' < "$LOG" > diag/analysed.log
          LOG=diag/analysed.log

          group() { echo "::group::$*"; }
          endgroup() { echo "::endgroup::"; }

          diagnose() {
            # ---- 1. Error annotations (visible on the run page without opening logs)
            grep -E 'error:|fatal error|Undefined symbols|undefined reference|unresolved external|ld: |lld-link: error|CMake Error|FAILED:' "$LOG" \
              | head -n 25 | sed 's/%/%25/g' \
              | while IFS= read -r line; do echo "::error title=Build error ($MATRIX_OS)::${line}"; done

            # ---- 2. Failed ninja commands, in full
            group "Failed ninja commands"
            grep -A1 '^FAILED:' "$LOG" | head -n 60
            endgroup

            # ---- 3. Search paths used by the first failed command
            first_cmd="$(grep -A1 -m1 '^FAILED:' "$LOG" | sed -n 2p)"
            if [[ -n "$first_cmd" ]]; then
              group "Search paths of the first failed command"
              echo "$first_cmd" | tr ' ' '\n' | grep -E -A1 '^(-isystem|-isysroot|-iquote|-framework|-arch|-target)$'
              echo "$first_cmd" | tr ' ' '\n' | grep -E '^(-I.|-L.|-l.|-F.|-Wl,-rpath|--sysroot|-stdlib|-nostdinc|-fmodule)'
              endgroup
            fi

            # ---- 4. Undefined symbols: which libraries define something similar?
            symbols="$( { sed -n 's/^ *"\(_[^"]*\)", referenced from.*/\1/p' "$LOG"; sed -n "s/.*undefined reference to \`\([^']*\)'.*/\1/p" "$LOG"; sed -n 's/.*unresolved external symbol \([^ ]*\).*/\1/p' "$LOG"; } | sort -u | head -n 10 )"
            if [[ -n "$symbols" ]]; then
              group "Undefined symbols and where similar symbols are defined"
              echo "$symbols"
              for sym in $symbols; do
                base="$(echo "${sym#_}" | sed -E 's/_[0-9]+$//')"
                echo "--- looking for '${base}' (any version suffix) in libraries under build/"
                find build -path '*/debug/*' -prune -o \( -name '*.a' -o -name '*.dylib' -o -name '*.so' \) -type f -print 2>/dev/null \
                  | while IFS= read -r lib; do
                      hit="$(nm -g "$lib" 2>/dev/null | grep -E "[ _]${base}(_[0-9]+)?\$" | head -n 3)"
                      if [[ -n "$hit" ]]; then echo "$lib"; echo "$hit" | sed 's/^/    /'; fi
                    done
              done
              endgroup
            fi

            # ---- 5. ICU: headers vs. libraries
            if [[ -f "$CACHE" ]] && grep -q '^ICU_' "$CACHE"; then
              group "ICU selection"
              grep -E '^ICU_' "$CACHE"
              icu_include="$(sed -n 's/^ICU_INCLUDE_DIR:[A-Z]*=//p' "$CACHE" | head -n 1)"
              if [[ -f "$icu_include/unicode/uvernum.h" ]]; then
                echo "--- headers: $icu_include"
                grep -E '^#define U_ICU_VERSION(_MAJOR_NUM|_SHORT)? ' "$icu_include/unicode/uvernum.h"
              else
                echo "ICU headers not found at: '$icu_include'"
              fi
              find build/vcpkg_installed -path '*/debug/*' -prune -o -name 'libicu*' -type f -print 2>/dev/null \
                | while IFS= read -r lib; do
                    echo "--- $lib"
                    nm -g "$lib" 2>/dev/null | grep -E 'u_charName' | head -n 5
                    ar t "$lib" 2>/dev/null | grep -i 'unames' | head -n 3
                  done
              if [[ -n "${LLVM_PREFIX:-}" && -f "$LLVM_PREFIX/include/unicode/uvernum.h" ]]; then
                echo "--- ICU headers inside the LLVM prefix (can shadow vcpkg's):"
                grep -E '^#define U_ICU_VERSION_MAJOR_NUM' "$LLVM_PREFIX/include/unicode/uvernum.h"
              fi
              endgroup
            fi

            # ---- 6. Important CMake cache values
            if [[ -f "$CACHE" ]]; then
              group "Selected CMake cache values"
              grep -E '^(CMAKE_(C|CXX)_COMPILER|CMAKE_BUILD_TYPE|CMAKE_(C|CXX)_FLAGS|CMAKE_.*LINKER_FLAGS|CMAKE_TOOLCHAIN_FILE|CMAKE_PREFIX_PATH|CMAKE_CXX_STDLIB_MODULES_JSON|CMAKE_OSX_|VCPKG_|Boost_(DIR|INCLUDE_DIR)|yaml-cpp_DIR|CLI11_DIR|GTest_DIR|ICU_)' "$CACHE" | sort
              endgroup

              # ---- 7. Compiler default search paths
              cxx="$(sed -n 's/^CMAKE_CXX_COMPILER:[A-Z]*=//p' "$CACHE" | head -n 1)"
              if [[ -n "$cxx" && "$RUNNER_OS" != "Windows" ]]; then
                group "Compiler default search paths ($cxx)"
                "$cxx" -v -E -x c++ - </dev/null 2>&1 | sed -n '/search starts/,/End of search/p'
                "$cxx" -print-resource-dir
                "$cxx" -print-search-dirs | head -n 5
                endgroup
              fi
            fi

            # ---- 8. Installed vcpkg packages
            if [[ -f build/vcpkg_installed/vcpkg/status ]]; then
              group "vcpkg packages installed for this build"
              grep -E '^(Package|Version):' build/vcpkg_installed/vcpkg/status | paste - - | sort -u
              endgroup
            fi

            # ---- 9. Configure-stage logs (only interesting if configure failed)
            if [[ ! -s diag/build.log ]]; then
              group "Tail of CMake configure logs"
              tail -n 80 diag/configure.log 2>/dev/null
              tail -n 80 build/CMakeFiles/CMakeError.log 2>/dev/null
              endgroup
            fi

            # ---- 10. vcpkg build logs: the real reason a dependency failed lives here
            cp build/vcpkg-manifest-install.log diag/vcpkg-logs/ 2>/dev/null
            if [[ -n "${VCPKG_INSTALLATION_ROOT:-}" && -d "$VCPKG_INSTALLATION_ROOT/buildtrees" ]]; then
              for f in "$VCPKG_INSTALLATION_ROOT"/buildtrees/*/*.log; do
                [[ -f "$f" ]] || continue
                cp "$f" "diag/vcpkg-logs/$(basename "$(dirname "$f")")-$(basename "$f")"
              done
            fi
            for f in diag/vcpkg-logs/*err*.log diag/vcpkg-logs/vcpkg-manifest-install.log; do
              [[ -s "$f" ]] || continue
              group "vcpkg log: $(basename "$f") (last 60 lines)"
              tail -n 60 "$f"
              endgroup
            done
          }

          diagnose 2>&1 | tee diag/diagnostics.txt

          # ---- Collect files for the artifact
          cp "$CACHE" build/.ninja_log build/compile_commands.json diag/ 2>/dev/null
          cp build/CMakeFiles/CMakeConfigureLog.yaml build/CMakeFiles/CMakeError.log build/CMakeFiles/CMakeOutput.log diag/ 2>/dev/null

          # ---- Job summary (shown on the run page)
          {
            echo "## Build failed: $MATRIX_OS / $MATRIX_TRIPLET"
            echo
            echo "### Failed commands"
            echo '```'
            grep -A1 '^FAILED:' "$LOG" | cut -c1-1500 | head -n 40
            echo '```'
            echo "### Last 40 lines of the log"
            echo '```'
            tail -n 40 "$LOG" | cut -c1-1500
            echo '```'
            echo "<details><summary>Full diagnostics</summary>"
            echo
            echo '```'
            grep -v '^::' diag/diagnostics.txt | cut -c1-600 | head -c 600000
            echo '```'
            echo "</details>"
            echo
            echo "Complete logs (build, configure, vcpkg, CMake cache, compile_commands.json) are in the **diagnostics-$MATRIX_ARTIFACT** artifact."
          } >> "$SUMMARY"
          exit 0

      - name: Upload diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: diagnostics-${{ matrix.artifact_name }}
          path: diag/
          if-no-files-found: ignore
          retention-days: 14

      # -------------------------------------------------------
      # 10. Tests
      # -------------------------------------------------------

      # - name: Test
      #   shell: bash
      #   run: |
      #     ctest \
      #       --test-dir build \
      #       --build-config Release \
      #       --output-on-failure

      # -------------------------------------------------------
      # Release binaries (only when called by tagged-build.yml)
      # -------------------------------------------------------

      - name: Stage release binaries
        if: inputs.upload_artifacts || inputs.release_tag != ''
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release

          if [[ "$RUNNER_OS" == "Windows" ]]; then
            executable="build/ispa.exe"
          else
            executable="build/ispa"
          fi
          test -f "$executable"
          cp "$executable" "release/$(basename "$executable")"

          cp scripts/install.sh scripts/update.sh scripts/install.ps1 scripts/update.ps1 release/

          # Preserve each platform's native shared-library filenames.
          # Some configurations build a converter statically instead.
          while IFS= read -r -d '' file; do
            cp "$file" "release/$(basename "$file")"
          done < <(find build -maxdepth 3 -type f \
            \( -name '*ispa-converter-*.so' -o -name '*ispa-converter-*.dylib' -o -name '*ispa-converter-*.dll' \
               -o -name '*ispa-algorithm-*.so' -o -name '*ispa-algorithm-*.dylib' -o -name '*ispa-algorithm-*.dll' \) \
            -print0)

          ls -lh release/

      - name: Add compiled Python CLIs to platform archive
        if: inputs.release_tag != ''
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ inputs.release_tag }}
          ISPA_RELEASE_PLATFORM: ${{ matrix.artifact_name }}
        run: |
          set -euo pipefail
          suffix="${ISPA_RELEASE_PLATFORM#ispa-}"
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            extension="zip"
            executable_suffix=".exe"
          else
            extension="tar.gz"
            executable_suffix=""
          fi
          mkdir -p pkg-download
          for name in ispa-pkg ispadbg ispa-ai; do
            gh release download "$TAG" --pattern "$name-$suffix.$extension" --dir pkg-download
          done
          python3 - "$suffix" "$extension" "$executable_suffix" <<'PY'
          from pathlib import Path
          import shutil
          import sys
          import tarfile
          import zipfile

          suffix, extension, executable_suffix = sys.argv[1:]
          for name in ('ispa-pkg', 'ispadbg', 'ispa-ai'):
              archive = f'{name}-{suffix}.{extension}'
              executable = name + executable_suffix
              source = Path('pkg-download') / archive
              target = Path('release') / executable
              if archive.endswith('.zip'):
                  with zipfile.ZipFile(source) as package, package.open(executable) as binary, target.open('wb') as output:
                      shutil.copyfileobj(binary, output)
              else:
                  with tarfile.open(source, 'r:gz') as package:
                      member = package.getmember(executable)
                      if not member.isfile():
                          raise RuntimeError(f'{archive} does not contain a regular {executable}')
                      with package.extractfile(member) as binary, target.open('wb') as output:
                          shutil.copyfileobj(binary, output)
              target.chmod(0o755)
          PY
          "release/ispa-pkg$executable_suffix" --help
          "release/ispadbg$executable_suffix" --help
          "release/ispa-ai$executable_suffix" --help

      - name: Sign Windows release files
        if: inputs.release_tag != '' && runner.os == 'Windows'
        shell: pwsh
        env:
          CERT_BASE64: ${{ secrets.ISPA_CODESIGN_CERT_BASE64 }}
          CERT_PASSWORD: ${{ secrets.ISPA_CODESIGN_CERT_PASSWORD }}
        run: |
          $ErrorActionPreference = 'Stop'
          if (-not $env:CERT_BASE64) {
            Write-Host 'No code-signing certificate configured; skipping Authenticode signing.'
            exit 0
          }
          if (-not $env:CERT_PASSWORD) { throw 'ISPA_CODESIGN_CERT_PASSWORD is required with the signing certificate.' }
          $certificatePath = Join-Path $env:RUNNER_TEMP 'ispa-codesign.pfx'
          [IO.File]::WriteAllBytes($certificatePath, [Convert]::FromBase64String($env:CERT_BASE64))
          try {
            $certificate = Import-PfxCertificate -FilePath $certificatePath `
              -CertStoreLocation Cert:\CurrentUser\My `
              -Password (ConvertTo-SecureString $env:CERT_PASSWORD -AsPlainText -Force)
            if (-not $certificate) { throw 'Could not import the ISPA signing certificate.' }
            $signTool = Get-ChildItem 'C:\Program Files (x86)\Windows Kits\10\bin\*\x64\signtool.exe' |
              Sort-Object FullName -Descending | Select-Object -First 1
            if (-not $signTool) { throw 'Windows SDK signtool.exe was not found.' }
            Get-ChildItem release -File | Where-Object { $_.Extension -in @('.exe', '.dll') } | ForEach-Object {
              & $signTool.FullName sign /fd SHA256 /td SHA256 /tr http://timestamp.digicert.com `
                /sha1 $certificate.Thumbprint $_.FullName
              if ($LASTEXITCODE -ne 0) { throw "Signing failed: $($_.Name)" }
            }
            Get-ChildItem release -Filter '*.ps1' -File | ForEach-Object {
              $result = Set-AuthenticodeSignature -FilePath $_.FullName -Certificate $certificate `
                -TimestampServer http://timestamp.digicert.com -HashAlgorithm SHA256
              if ($result.Status -ne 'Valid') { throw "Signing failed: $($_.Name): $($result.StatusMessage)" }
            }
          } finally {
            Remove-Item -LiteralPath $certificatePath -Force -ErrorAction SilentlyContinue
          }

      - name: Upload release build artifacts
        if: inputs.upload_artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: release/
          if-no-files-found: error

      # Publish as soon as THIS matrix entry has completed. There is no
      # matrix-wide publication barrier, and each archive has a unique name.
      - name: Package completed platform
        if: inputs.release_tag != ''
        shell: bash
        env:
          ISPA_RELEASE_PLATFORM: ${{ matrix.artifact_name }}
        run: |
          set -euo pipefail
          mkdir -p packages
          python3 - <<'PYPACK'
          import os
          import tarfile
          from pathlib import Path
          from zipfile import ZipFile, ZIP_DEFLATED

          platform = os.environ['ISPA_RELEASE_PLATFORM']
          release = Path('release')
          files = sorted(p for p in release.iterdir() if p.is_file())
          executable_suffix = '.exe' if os.environ['RUNNER_OS'] == 'Windows' else ''
          for name in ('ispa', 'ispa-pkg', 'ispadbg', 'ispa-ai'):
              expected = name + executable_suffix
              if not (release / expected).is_file():
                  raise RuntimeError(f'Release executable is missing: {expected}')

          if os.environ['RUNNER_OS'] == 'Windows':
              output = Path('packages') / f'{platform}.zip'
              with ZipFile(output, 'w', compression=ZIP_DEFLATED, compresslevel=9) as archive:
                  for path in files:
                      archive.write(path, arcname=path.name)
          else:
              output = Path('packages') / f'{platform}.tar.gz'
              with tarfile.open(output, 'w:gz') as archive:
                  for path in files:
                      archive.add(path, arcname=path.name, recursive=False)
          print(f'Created {output}')
          PYPACK

      - name: Publish completed platform to GitHub Release
        if: inputs.release_tag != ''
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ inputs.release_tag }}
          ISPA_RELEASE_PLATFORM: ${{ matrix.artifact_name }}
        run: |
          set -euo pipefail
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            archive="packages/$ISPA_RELEASE_PLATFORM.zip"
          else
            archive="packages/$ISPA_RELEASE_PLATFORM.tar.gz"
          fi
          test -f "$archive"
          gh release upload "$TAG" "$archive" --clobber
          # The draft is created by tagged-build.yml before matrix builds start.
          gh release edit "$TAG" --draft=false

      # -------------------------------------------------------
      # 11. Cache statistics and cleanup
      # -------------------------------------------------------

      - name: Show sccache statistics
        if: always()
        shell: bash
        run: |
          sccache --show-stats || true
      - name: Diagnose compiler cache
        if: always()
        shell: bash
        run: |
          sccache --show-stats
          ninja -C build -t commands | grep -E '\.modmap|\.pcm' | head -20 || true

      - name: Stop sccache
        if: always()
        shell: bash
        run: sccache --stop-server || true

      - name: Save sccache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: ${{ env.SCCACHE_DIR }}
          key: sccache-${{ matrix.os }}-${{ matrix.triplet }}-${{ github.sha }}
