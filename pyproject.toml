[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ispa-pkg"
version = "0.1.0"
description = "ISPA library package manager"
requires-python = ">=3.9"
dependencies = ["PyYAML>=6,<7"]

[project.optional-dependencies]
antlr-to-ispa = ["tree-sitter-language-pack==0.10.0", "tree-sitter>=0.25.2,<0.27"]

[project.scripts]
ispa-pkg = "ispa_pkg.cli:main"
ispa-lsp = "ispa_pkg.lsp:main"
ispa-ai = "ispa_pkg.ai:main"
antlr-to-ispa = "antlr_to_ispa.cli:main"
flex-to-ispa = "lex_yacc_to_ispa.flex_cli:main"
bison-to-ispa = "lex_yacc_to_ispa.bison_cli:main"

[tool.setuptools.packages.find]
where = ["cli/pkg"]
include = ["ispa_pkg*", "antlr_to_ispa*", "lex_yacc_to_ispa*"]

[tool.setuptools.package-data]
antlr_to_ispa = ["grammar/*.isc"]
