# The language-neutral runtime: a restricted Python subset (ispa_std) that every target lowers.
# Targets call it and add only their native residue; they list it under `requires`.
name: target-core
layout:
  root: parser/stdlibs/python/ispa_std/out
  ispalib:
    python/ispa_std: ispa_std
  ispatarget: {}
