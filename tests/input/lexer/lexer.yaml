bootloader: lexer

tests:

  # BASIC

  - name: templated_type
    path: basic/templated_type.isc
    input: "template  type == str"

    expect:
      - for: TEMPLATED_TYPE
        value:
          op: '=='
          type: 'str'


  - name: id
    path: basic/id.isc
    input: "helloWorld1234"

    expect:
      - for: ID
        value: 'helloWorld1234'
  - name: serial_code
    path: basic/serial_code.isc
    input: "XF"

    expect:
      - for: SERIAL_CODE
        value: 'F'
