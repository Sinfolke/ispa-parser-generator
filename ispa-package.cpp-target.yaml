# `--stdlib ispastdlib` (the default, plain C++ target): the hand-written C++ runtime. It now lives inside
# target/cpp-core on disk (cpp-core's facade wraps it), so this package borrows just the ispastdlib pieces,
# the same way cpp-core used to borrow from here before the move.
name: cpp-target
requires:
  - target-core
layout:
  root: parser/stdlibs
  ispalib: {}
  ispatarget:
    cpp/ispastdlib: target/cpp-core/ispastdlib
  files:
    ispatarget/cpp/ispastdlib.hpp: target/cpp-core/ispastdlib.hpp
    ispatarget/cpp/src/core.cpp: target/cpp-core/src/core.cpp
