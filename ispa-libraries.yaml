# Public package catalog. Update it with `ispa-pkg catalog update`.
packages:
  std:
    github: Sinfolke/ispa-parser-generator
    ref: libraries-{generator}-latest
  target-core:
    github: Sinfolke/ispa-parser-generator
    ref: libraries-{generator}-latest
    manifest: ispa-package.target-core.yaml
  target-cpp:
    github: Sinfolke/ispa-parser-generator
    ref: libraries-{generator}-latest
    manifest: ispa-package.target-cpp.yaml
  python-target:
    github: Sinfolke/ispa-parser-generator
    ref: libraries-{generator}-latest
    manifest: ispa-package.python-target.yaml
  rust-target:
    github: Sinfolke/ispa-parser-generator
    ref: libraries-{generator}-latest
    manifest: ispa-package.rust-target.yaml
